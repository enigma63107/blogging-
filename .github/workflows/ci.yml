name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Frontmatter is validated during the build, so a post with a bad date or
      # a duplicate slug fails here rather than on the deploy.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
